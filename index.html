var SFX = (function() {
  var actx = null, muted = false, musicOn = false, bgmTimer = null, nextT = 0, step = 0, noiseBuf = null;
  try { muted = localStorage.getItem('ss-sfx-muted') === '1'; } catch (e) {}
  try { musicOn = localStorage.getItem('ss-music-on') === '1'; } catch (e) {}

  function ac() {
    if (!actx) {
      var AC = window.AudioContext || (window.webkitAudioContext || null);
      if (!AC) return null;
      actx = new AC();
    }

    return actx;
  }
  function tone(freq, dur, type, vol, offset, slideTo, force) {
    var ctx = ac(); if (!ctx) return;
    if (muted && !force) return;
    var t0 = ctx.currentTime + (offset || 0);
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t0);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  function noise(dur, vol, freq) {
    var ctx = ac(); if (!ctx || muted) return;
    if (!noiseBuf) {
      var len = Math.floor(ctx.sampleRate * 0.5);
      noiseBuf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = noiseBuf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    var src = ctx.createBufferSource(); src.buffer = noiseBuf;
    var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1100;
    var g = ctx.createGain();
    var t0 = ctx.currentTime;
    g.gain.setValueAtTime(vol || 0.16, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(ctx.destination);
    src.start(t0); src.stop(t0 + dur + 0.03);
  }
  function seq(notes, type, vol, dur, gap) {
    for (var i = 0; i < notes.length; i++) {
      tone(notes[i], dur || 0.12, type || 'square', vol || 0.1, i * (gap || 0.1));
    }
  }
  function startMusic() {
    var ctx = ac(); if (!ctx || bgmTimer) return;
    step = 0; nextT = ctx.currentTime + 0.1;
    bgmTimer = setInterval(function() {
      var c = ac(); if (!c) return;
      var mkey = (typeof S === 'function' && S() && S().bgmOverride) ? S().bgmOverride : ((typeof S === 'function' && S() && MELODIES[S().theme]) ? S().theme : 'default');
      var mlist = MELODIES[mkey] || MELODIES.default;
      while (nextT < c.currentTime + 0.28) {

        nextT += n[1] * 0.94;

      }

  }
  function stopMusic() { if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; } }

    var t = 1;
    try {
      var g = S();

    } catch (e) {}

  }

  return {
    ensure: ac,
    isMuted: function() { return muted; },
    isMusicOn: function() { return musicOn; },
    toggleMute: function() {
      muted = !muted;

    initMusic: function() { if (musicOn) startMusic(); },
    click: function() { tone(660, 0.06, 'square', 0.05); },

function pickEventIndex(list, g) {
  if (!g.lastEvents) g.lastEvents = [];
  var idx = Math.floor(Math.random() * list.length);
  var tries = 0;
  while (g.lastEvents.indexOf(idx) >= 0 && tries < 8) {
    idx = Math.floor(Math.random() * list.length);
    tries++;
  }
  g.lastEvents.push(idx);
  if (g.lastEvents.length > 3) g.lastEvents.shift();
  return idx;
}

  map.forEach(function(m) {

      html += '<div class="stat"><div class="label"><span>' + m[1] + '</span><span>' + Math.round(v) + '</span></div></div>';

    }
    var pct = Math.max(0, Math.min(100, v / m[2] * 100));
    var hearts = (m[0] === 'rel' && v >= 520) ? ' hearts' : '';
    var low = (pct < 60 && !hearts) ? ' low' : '';

  });

function workQ(n, score) {
  if (n >= 5) {
    var g = S();
    $('workQ').classList.add('hidden');
    $('workInput').classList.add('hidden');
    var mult = (g.workBuff && g.workBuff.mult) ? g.workBuff.mult : 1;
    if (g.mirrorBuff) mult = mult * 1.5;
    var per = 100;
    var bonus = (g.workBuff && g.workBuff.bonus) ? g.workBuff.bonus : 0;
    var moodF = 0.6 + avgMood() / 250;
    var bigChance = Math.min(0.4, (0.04 + totalPayroll() / 50000 + (g.office ? 0.05 : 0)) * moodF);
    var rr = Math.random();
    var base = 0;
    if (rr < 0.15) base = 0;
    else if (rr < 0.15 + bigChance) base = 10000 + Math.floor(Math.random() * 10001);
    else base = 1000 + Math.floor(Math.random() * 5001);
    var earn = Math.round((base + score * per) * mult) + bonus;
    addMoney(earn);
    if (earn > 0) g.gotIncomeToday = true;
    addStat('energy', -12);
    addStat('mood', g.withYoyo ? 0 : -4);
    if (g.withYoyo) addStat('rel', 15);
    if (earn === 0) {
      SFX.wrong();
      log('今天没接到什么活……赚了 0 元', 'bad');
    } else if (base >= 10000) {
      SFX.fanfare();
      SFX.coin();
      log('🔥 大单！今天赚了 ' + earn + ' 元（含答题奖励 ' + Math.round(score * per * mult) + ' 元）', 'ok');
    } else {
      SFX.coin();
      var earnLines = [
        '下班啦！今天赚了 ' + earn + ' 元（含答题奖励 ' + Math.round(score * per * mult) + ' 元）',
        '收工！今天进账 ' + earn + ' 元',
        '今天到手 ' + earn + ' 元，美滋滋',
        '手机上跳出到账通知：+' + earn + ' 元'
      ];
      log(earnLines[Math.floor(Math.random() * earnLines.length)], 'ok');
    }
    unlock('work1');
    if (g.withYoyo) log('柚柚说：明天还要来帮你！', 'ok');
    afterWork();
    return;
  }
  var a = 2 + Math.floor(Math.random() * 40);
  var op = Math.random() < 0.5 ? '+' : '-';
  var b = 1 + Math.floor(Math.random() * (op === '-' ? a : 20));
  var ans = op === '+' ? a + b : a - b;
  $('workQ').classList.remove('hidden');
  $('workQ').textContent = '第 ' + (n + 1) + ' 题：' + a + ' ' + op + ' ' + b + ' = ？';
  var inp = $('workInput');
  inp.classList.remove('hidden');
  inp.value = '';
  inp.focus();
  choices([
    { text: '提交答案', cls: 'green', fn: function() {
      var v = parseInt(inp.value, 10);
      if (isNaN(v)) { log('请输入数字再提交～', 'bad'); return; }
      if (v === ans) {
        SFX.correct();
        log('✅ 正确！', 'ok');
        workQ(n + 1, score + 1);
      } else {
        SFX.wrong();
        log('❌ 答错啦，答案是 ' + ans, 'bad');
        workQ(n + 1, score);
      }
    } }
  ]);
}

function barGame(steps, label, onEnd) {
  var n = 0, ok = 0;
  function step() {
    if (n >= steps) { onEnd(ok); return; }
    n++;
    $('choices').innerHTML = '';
    var bar = document.createElement('div');
    bar.id = 'fishing';
    var zoneLeft = 18 + Math.random() * 45;
    bar.innerHTML = '<div class="zone" style="left:' + zoneLeft + '%;width:24%"></div><div class="needle" style="left:0%"></div>';
    $('choices').appendChild(bar);
    var stop = document.createElement('button');
    stop.type = 'button';
    stop.className = 'btn green';
    stop.textContent = '🎯 第 ' + n + ' 次：就是现在！';
    $('choices').appendChild(stop);
    var pos = 0, dir = 1, raf = null;
    var needle = bar.querySelector('.needle');
    function tick() {
      pos += dir * 3;
      if (pos > 96) { pos = 96; dir = -1; }
      if (pos < 0) { pos = 0; dir = 1; }
      needle.style.left = pos + '%';
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    stop.onclick = function() {
      cancelAnimationFrame(raf);
      var hit = pos >= zoneLeft && pos <= zoneLeft + 24;
      if (hit) { ok++; SFX.correct(); log('第 ' + n + ' 次完美！', 'ok'); }
      else { SFX.wrong(); log('第 ' + n + ' 次差一点……', 'bad'); }
      step();
    };
  }
  logTitle(label);
  step();
}
function cloudGame(onEnd) {
  var got = 0, resolved = 0;
  var box = document.createElement('div');
  box.style.cssText = 'position:relative;height:140px;background:#3d4a5e;border:3px solid #48566b;border-radius:12px;margin-bottom:8px;overflow:hidden;';
  $('choices').innerHTML = '';
  $('choices').appendChild(box);
  function done() { setTimeout(function() { $('choices').innerHTML = ''; onEnd(got); }, 350); }
  function resolve() { resolved++; if (resolved >= 3) done(); }
  for (var i = 0; i < 3; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = '☁️';
    b.style.cssText = 'position:absolute;font-size:30px;background:none;border:none;cursor:pointer;left:' + (8 + Math.random() * 70) + '%;top:' + (10 + Math.random() * 50) + '%';
    b.onclick = function() { SFX.pop(); got++; this.remove(); resolve(); };
    box.appendChild(b);
    (function(btn) {
      setTimeout(function() { if (btn.parentNode) { btn.remove(); resolve(); } }, 4500);
    })(b);
  }
  logTitle('忧郁的一天……点掉心里的乌云（3 朵）');
}

/* ===== 小游戏：猜拳 / 拍蚂蚁 / 做饭 ===== */
function rpsGame(rounds, onEnd) {
  var r = 0, wins = 0;
  function settle(mine, comp) {
    r++;
    if (mine === comp) log('平局：' + mine + ' vs ' + comp, '');
    else if ((mine === '石头' && comp === '剪刀') || (mine === '剪刀' && comp === '布') || (mine === '布' && comp === '石头')) {
      wins++; SFX.correct(); log('你赢了：' + mine + ' vs ' + comp, 'ok');
    } else {
      SFX.wrong(); log('你输了：' + mine + ' vs ' + comp, 'bad');
    }
    round();
  }
  function round() {
    if (r >= rounds) { onEnd(wins); return; }
    var comp = ['石头', '剪刀', '布'][Math.floor(Math.random() * 3)];
    choices([
      { text: '🪨 石头', cls: 'gray', fn: function() { settle('石头', comp); } },
      { text: '✂️ 剪刀', cls: 'gray', fn: function() { settle('剪刀', comp); } },
      { text: '📄 布', cls: 'gray', fn: function() { settle('布', comp); } }
    ]);
  }
  logTitle('猜拳小游戏（' + rounds + ' 局）');
  round();
}
function antGame(onEnd) {
  var got = 0, resolved = 0;
  var box = document.createElement('div');
  box.style.cssText = 'position:relative;height:140px;background:#2f3a22;border:3px solid #48566b;border-radius:12px;margin-bottom:8px;overflow:hidden;';
  $('choices').innerHTML = '';
  $('choices').appendChild(box);
  function done() { setTimeout(function() { $('choices').innerHTML = ''; onEnd(got); }, 350); }
  function resolve() { resolved++; if (resolved >= 3) done(); }
  for (var i = 0; i < 3; i++) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = '🐜';
    b.style.cssText = 'position:absolute;font-size:28px;background:none;border:none;cursor:pointer;left:' + (8 + Math.random() * 74) + '%;top:' + (8 + Math.random() * 55) + '%';
    b.onclick = function() { SFX.pop(); got++; this.remove(); resolve(); };
    box.appendChild(b);
    (function(btn) {
      setTimeout(function() { if (btn.parentNode) { btn.remove(); resolve(); } }, 4500);
    })(b);
  }
  logTitle('野餐开始！快拍掉偷吃的小蚂蚁（3 只）');
}
function cookGame(onEnd) {
  var n = 0, ok = 0;
  function step() {
    if (n >= 4) { onEnd(ok); return; }
    n++;
    $('choices').innerHTML = '';
    var bar = document.createElement('div');
    bar.id = 'fishing';
    var zoneLeft = 20 + Math.random() * 45;
    bar.innerHTML = '<div class="zone" style="left:' + zoneLeft + '%;width:22%"></div><div class="needle" style="left:0%"></div>';
    $('choices').appendChild(bar);
    var stop = document.createElement('button');
    stop.type = 'button';
    stop.className = 'btn orange';
    stop.textContent = '🍳 第 ' + n + ' 步：翻锅！';
    $('choices').appendChild(stop);
    var pos = 0, dir = 1, raf = null;
    var needle = bar.querySelector('.needle');
    function tick() {
      pos += dir * 3;
      if (pos > 96) { pos = 96; dir = -1; }
      if (pos < 0) { pos = 0; dir = 1; }
      needle.style.left = pos + '%';
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    stop.onclick = function() {
      cancelAnimationFrame(raf);
      var hit = pos >= zoneLeft && pos <= zoneLeft + 22;
      if (hit) { ok++; SFX.correct(); log('第 ' + n + ' 步完美！', 'ok'); }
      else { SFX.wrong(); log('第 ' + n + ' 步糊了一点……', 'bad'); }
      step();
    };
  }
  logTitle('和柚柚一起做饭！看准时机翻锅（4 步）');
  step();
}

function sleep() {
  S().phase = 'sleep';
  setScene('sleep');

    g.liveTogether = true;
    g.cohabitDays = 1;
    g.withYoyo = true;

    unlock('cohabit');
    setTheme('home');

  }
  employeeIncome();

    addStat('mood', -5);
    log('😔 一天没收到钱，酸酸盯着手机屏幕，有点难过……', 'bad');
  }
  if (g.liveTogether && Math.random() < 0.4) {
    addStat('mood', 4);
    log('💬 柚柚睡前说：' + YOYO_LINES[Math.floor(Math.random() * YOYO_LINES.length)], 'ok');
  }
  rollEvent();
  if (g.energy <= 0) {
    addStat('energy', 60);
    log('你太累了，直接睡到第二天中午，体力恢复 +60', '');
  } else {
    addStat('energy', 35);
    addStat('full', -25);
    var sleepLines = ['睡了个好觉，体力 +35', '一夜无梦，体力+35', '柚柚的晚安语音循环了三遍，睡得很香，体力+35', '被子一裹，直接睡到天亮，体力+35'];
    log(sleepLines[Math.floor(Math.random() * sleepLines.length)], 'ok');
  }
  if (g.carClean < 25) log('车太脏了，明天抽空洗一洗吧', 'bad');
  var entry = {
    day: g.day,
    season: seasonName(),
    weather: weatherNow().name,
    worked: g.workedToday,
    played: g.playedToday,
    yoyo: g.withYoyo,
    earn: Math.max(0, g.money - g.moneyAtMorning),

  };

  log('📔 你往日记本上写了几笔', '');

}
function nextDay() {

  g.gotIncomeToday = false;
  g.bgmOverride = null;
  g.moneyAtMorning = g.money;
  g.workedToday = false;
  g.playedToday = false;
  g.mirrorBuff = false;
  var sn = Math.floor((g.day - 1) / 20) % 4;
  if (g.lastSeason !== sn) {
    g.lastSeason = sn;
    var snName = ['春', '夏', '秋', '冬'][sn];
    log(seasonIco() + ' ' + snName + '天来了！', 'big');
    if (sn === 0) { addStat('luck', 1); log('🌸 春天，万物复苏，运气+1', 'ok'); }
    if (sn === 1) { addStat('energy', 5); log('☀️ 夏天，冰饮管够，体力+5', 'ok'); }
    if (sn === 2) { addMoney(500); log('🍂 秋天，公司分红 500 元', 'ok'); }

  }
  SFX.chime();
  g.withYoyo = g.withYoyo && Math.random() < 0.75;
  if (g.liveTogether) {
    g.withYoyo = true;
    g.cohabitDays++;
    addStat('energy', 8);
    addStat('mood', 8);
    log('🍳 柚柚做好了早餐，还帮你整理了领带：体力+8，心情+8', 'ok');
    if (g.cohabitDays >= 10) unlock('cohabit10');
  }
  if (g.sleptInCar) g.sleptInCar = false;
  if (g.car === 'buick') addStat('carClean', -8);
  else addStat('carClean', -12);
  addStat('full', -15);
  rollWeather();
  resolveStock();
  resolveBtc();
  payday();
  tantrumRoll();
  yoyoBuff();
  modeRolls();
  bigEventRoll();
  checkRoutes();
  if (g.employees.length >= 50) unlock('staff50');
  if (STORY_BEATS[g.day]) {
    addStat('mood', 5);
    log('📖 ' + STORY_BEATS[g.day], 'big');
    if (g.day === 66) addMoney(666);
  }
  if (g.day === 33) {
    unlock('luck33');
    addMoney(3333);
    addStat('mood', 33);
    SFX.fanfare();
    log('33️⃣ 第 33 天！窗外的云刚好组成一个"33"，你捡到 3333 元红包！', 'big');
  }
  if (g.day === 100) {
    unlock('day100');
    celebration();
  }
  if (g.equip) {
    if (g.equip.phone) addStat('mood', 3);
    if (g.equip.house) { addStat('energy', 5); addStat('mood', 5); }
    if (g.equip.guitar && g.withYoyo) addStat('rel', 5);
  }
  if (g.pets && g.pets.length) {
    for (var pi = 0; pi < g.pets.length; pi++) addStat('mood', 3);
  }
  if (g.carIssue) {
    addStat('mood', -5);
    log('🚨 车还没修好（' + (g.carIssue === 'tire' ? '轮胎' : '空调') + '），今晚记得去修！', 'bad');
  }
  if (g.ugly) {
    addStat('mood', -3);
    if (g.withYoyo) {
      addStat('rel', 8);
      log('柚柚看到你的黑眼圈，又心疼又好笑，关系+8', 'ok');
    } else {
      log('顶着黑眼圈出门，今天有点憔悴，心情-3', 'bad');
    }
    g.ugly = false;
  }
  if (g.handsome) {
    addStat('mood', 5);
    log('✨ 昨天K歌太帅，今天走路都带风，心情+5', 'ok');

  }
  if (g.kingDay > 0) {

  }
  if (g.rel >= 900) unlock('love');
  if (g.vis.drive >= 10) unlock('drive10');

  setScene('road');
  if (g.carClean < 30) log('🚨 车脏得不行了，今天记得洗车！', 'bad');

function showAch() {
  var g = S();

  });
  var routesN = 0;
  for (var i = 0; i < ROUTES.length; i++) if (g.routes && g.routes[ROUTES[i].id]) routesN++;

  for (var p = 0; p < places.length; p++) if (g.vis && g.vis.places && g.vis.places[places[p]]) placeN++;

  var ticketN = g.tickets ? Object.keys(g.tickets).length : 0;
  var petN = g.pets ? g.pets.length : 0;

}

var titleClicks = 0;
if (canvas && canvas.addEventListener) {
  canvas.addEventListener('click', function(ev) {
    var g = S();
    if (g.scene !== 'title') return;
    var rect = canvas.getBoundingClientRect();
    if (!rect || !rect.width) return;
    var x = (ev.clientX - rect.left) / rect.width * 360;
    var y = (ev.clientY - rect.top) / rect.height * 240;
    if (y > 48 && y < 74 && Math.abs(x - 180) < 90) {
      titleClicks++;
      if (titleClicks === 5) {
        addStat('mood', 5);
        SFX.chime();
        log('💬 你终于注意到我了……（隐藏 buff：心情+5）', 'ok');

      SFX.pop();
      log('💬 酸酸：今天也是元气满满的一天！', '');
    } else if (x > 198 && x < 266 && y > 66 && y < 150) {
      SFX.pop();
      log('💬 柚柚：哼，才不是特意来看你的！', '');
    }
  });
}

<style>
  #gate {
    position: fixed; inset: 0; z-index: 999;
    background: #1d2430;
    display: flex; align-items: center; justify-content: center;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  .gate-box {
    width: calc(100% - 64px); max-width: 320px;
    background: #262f3d; border: 4px solid #ffd166; border-radius: 18px;
    padding: 24px 20px; text-align: center;
  }
  .gate-title { font-size: 24px; font-weight: 800; color: #ffd166; letter-spacing: 4px; }
  .gate-sub { font-size: 13px; color: #b9c4d4; margin: 8px 0 18px; }
  #gatePwd {
    width: 100%; min-height: 46px; font-size: 18px; text-align: center;
    background: #1d2430; color: #ffd166; border: 3px solid #48566b;
    border-radius: 12px; box-sizing: border-box; outline: none;
  }
  #gateBtn {
    width: 100%; min-height: 46px; margin-top: 12px;
    background: #3f9e5f; color: #fff; border: 3px solid #66c484;
    border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #gateBtn:active { transform: translateY(2px); }
  #gateErr { display: none; color: #ff8fa3; font-size: 13px; margin-top: 12px; }
</style>
<script>
(function() {
  var HASH = '0db1804a6beaabd4686ed1f9a9763427df438dafe97e3a2a761e1db81405f538';
  function sha(s) {
    if (window.crypto && crypto.subtle) {
      return crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)).then(function(buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function(x) {
          return ('0' + x.toString(16)).slice(-2);
        }).join('');
      });
    }
    return Promise.resolve(null);
  }
  function unlock() {
    var g = document.getElementById('gate');
    if (g && g.remove) g.remove();
    else if (g && g.parentNode) g.parentNode.removeChild(g);
  }
  function check() {
    var v = document.getElementById('gatePwd').value.trim();
    sha(v).then(function(h) {
      var good = h ? (h === HASH) : (v === '3366');
      if (good) {
        unlock();
      } else {
        document.getElementById('gateErr').style.display = 'block';
        document.getElementById('gatePwd').value = '';
        document.getElementById('gatePwd').focus();
      }
    });
  }
  document.getElementById('gateBtn').addEventListener('click', check);
  document.getElementById('gatePwd').addEventListener('keydown', function(ev) {
    if (ev.key === 'Enter') check();
  });
  document.getElementById('gatePwd').focus();
})();
</script>
